name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ems
          POSTGRES_USER: ems_owner
          POSTGRES_PASSWORD: ems_owner
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U ems_owner -d ems"
          --health-interval 2s --health-retries 30
    env:
      PROVIDER: offline   # deterministic stand-ins; no API keys in CI
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Create the application role (no BYPASSRLS)
        run: psql "postgresql://ems_owner:ems_owner@localhost:5433/ems" -f ../docker/db-init/01-roles.sql
      - run: uv sync --frozen
      - run: uv run ruff check . ../eval ../seed
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
