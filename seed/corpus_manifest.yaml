# The demo corpus. Everything is fictional.
#
# seed/generate_corpus.py renders each entry into the file under seed/corpus/ and
# api/app/ingest reads the metadata here as if it had been typed into the upload form.
# `purpose` says why the document exists; `used_by` names the tests and golden-set
# entries that depend on it, so nothing here can be changed without seeing what breaks.
#
# Dates: document_date is the date on the document, received_date is when an incoming
# document reached us, submitted_date is when an outgoing document left us.

documents:

  # ---------------------------------------------------------------------------
  # Ministry example (SRS 1.14.9). Four letters from MEH on four different days, one
  # from GAES on the same day as document X. A semantic search for "letter from the
  # ministry about the permit" lands on LTR-MEH-0407 (the permit approval), which is wrong.
  # ---------------------------------------------------------------------------

  - id: LTR-MEH-0210
    file: letters/MEH_Licensing_Requirements_2026-02-10.pdf
    format: letter
    title: Licensing Requirements for Riyadh Design Expo 2026
    title_ar: متطلبات ترخيص معرض الرياض للتصميم 2026
    doc_type: letter
    language: en
    direction: incoming
    sender: MEH
    recipient: LNZ
    reference_no: MEH/EVT/2026/0187
    document_date: 2026-02-09
    received_date: 2026-02-10
    event: EXPO26
    confidentiality: normal
    purpose: First of four MEH letters; distractor for the Ministry example.
    used_by: [test_1_14_9_ministry_example_ranks_first, golden:asst-en-01]
    signatory: Dr. Sultan Al-Dossary
    signatory_title: Deputy Minister for Events
    body:
      - Dear Sirs,
      - With reference to your notification of intent dated 28 January 2026 to organise the Riyadh Design Expo 2026 at Al Malqa Exhibition Centre, the Ministry advises that an exhibition permit will be considered on receipt of the following documents.
      - 1. A completed exhibition permit application signed by the organiser's authorised representative.
      - 2. A scaled floor plan showing booth positions, aisle widths and emergency exits.
      - 3. A crowd management plan stating the maximum expected occupancy at any one time.
      - 4. A copy of the venue rental agreement.
      - The complete file must reach the Ministry no later than 20 March 2026. Applications received after this date will be reviewed in the following licensing cycle.
      - Yours faithfully,

