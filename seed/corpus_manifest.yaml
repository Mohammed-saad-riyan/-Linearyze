    received_date: 2026-03-03
    event: EXPO26
    confidentiality: normal
    purpose: Second MEH letter, Arabic, with Arabic-Indic digits (SRS 1.4.4).
    used_by: [test_1_14_9_ministry_example_ranks_first, golden:asst-ar-02, golden:asst-ar-03]
    signatory: د. سلطان الدوسري
    signatory_title: وكيل الوزارة للفعاليات
    body:
      - السادة/ شركة لينيرايز لتنظيم الفعاليات المحترمين
      - "السلام عليكم ورحمة الله وبركاته، وبعد:"
      - "فإشارةً إلى المخطط المبدئي لمعرض الرياض للتصميم ٢٠٢٦ المرفوع إلى الوزارة، نفيدكم بأنه قد تمت دراسته من قبل الإدارة المختصة، وتبيّن ما يلي:"
      - أولاً- يجب ألا يقل عرض ممرات الطوارئ عن ٢٫٤ متر في جميع أجزاء القاعة.
      - ثانياً- يُحدَّد الحد الأقصى للحضور في وقت واحد بـ ٣٥٠٠ زائر، ولا يجوز تجاوزه.
      - ثالثاً- يُنقل الجناح رقم B-14 بعيداً عن المخرج الشمالي بمسافة لا تقل عن خمسة أمتار.
      - وعليه نأمل استكمال التعديلات المطلوبة وإرفاقها مع طلب التصريح.
      - وتقبلوا خالص التحية والتقدير،

