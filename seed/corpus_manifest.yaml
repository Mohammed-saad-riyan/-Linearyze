    event: EXPO26
    confidentiality: normal
    purpose: >
      THE answer to the Ministry example. Received on 17 March 2026, the day document X
      (OUT-LNZ-0093) was submitted. Its subject has nothing to do with permits, so only
      a date-joined lookup finds it.
    used_by: [test_1_14_9_ministry_example_ranks_first, golden:asst-ministry-en, golden:asst-ministry-ar]
    signatory: د. سلطان الدوسري
    signatory_title: وكيل الوزارة للفعاليات
    body:
      - السادة/ منظمي المعارض والفعاليات المرخصة المحترمين
      - "السلام عليكم ورحمة الله وبركاته، وبعد:"
      - تهدي وزارة المعارض والتراث أطيب تحياتها، وتودّ الإحاطة بأن مواعيد تشغيل المعارض خلال إجازة عيد الفطر لعام ١٤٤٧هـ تكون من الساعة ٤ عصراً حتى الساعة ١٢ منتصف الليل.
      - ويُستثنى من ذلك اليوم الأول من العيد، إذ يبدأ التشغيل من الساعة ٨ مساءً.
      - وعلى المنظمين إبلاغ العارضين بهذه المواعيد، وتحديث اللوحات الإرشادية والمواقع الإلكترونية تبعاً لذلك.
      - وتقبلوا خالص التحية والتقدير،

