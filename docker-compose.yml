# Postgres 16 + pgvector for local development and tests. The API and web app run from
# source (see README); production runs on Vercel with Neon.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ems
      POSTGRES_USER: ems_owner
      POSTGRES_PASSWORD: ems_owner
    ports: ["5433:5432"]
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ems_owner -d ems"]
      interval: 2s
      retries: 30

volumes:
  db-data:
